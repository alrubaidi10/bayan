name: bayan_flutter
description: "Bayan ERP - Commercial Accounting & Resource Planning System (Offline-First Flutter Desktop & Mobile)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local DB & Sync
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3
  uuid: ^4.2.2

  # Firebase Cloud Services
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0
  firebase_auth: ^4.16.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.10

  # State Management & Utilities
  flutter_riverpod: ^2.4.9
  intl: ^0.18.1
  connectivity_plus: ^5.0.2

  # UI Components & Charts
  fl_chart: ^0.66.0
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.1.0

  # PDF & Printing
  pdf: ^3.10.7
  printing: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
